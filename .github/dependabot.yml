version: 2
updates:
  - package-ecosystem: docker
    directories:
    - /hack/containers
    - /make/config/pebble
    - /make/config/samplewebhook
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
  - package-ecosystem: gomod
    directories:
    - /
    - /cmd/acmesolver
    - /cmd/cainjector
    - /cmd/controller
    - /cmd/startupapicheck
    - /cmd/webhook
    - /test/e2e
    - /test/integration
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
  - package-ecosystem: helm
    directories:
    - /deploy/charts/cert-manager
    - /make/config/pebble/chart
    - /make/config/samplewebhook/chart
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
